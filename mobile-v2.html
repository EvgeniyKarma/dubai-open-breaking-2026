<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dubai Open Breaking 2026. Discover the World Breaking Championships and Junior World Breaking Championships, 18–20 December 2026.">
  <title>Dubai Open Breaking 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile-v2.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="homepage">
    <video class="background-video" autoplay loop muted playsinline preload="auto" aria-hidden="true">
      <source src="wob3_compressed.mp4" type="video/mp4">
    </video>
    <div class="mobile-v2-layout">
    <h1 class="page-title" aria-label="Dubai Open Breaking 2026"><span class="title-line">Dubai Open</span><span class="title-line">Breaking 2026</span></h1>
    <img class="logo" src="Logo.png" alt="Dubai Open Breaking 2026" width="100" height="100">
    <section class="event-listings" aria-label="Competitions">
      <a class="event-card" href="/world-breaking-championships/" aria-label="Learn more about World Breaking Championships">
        <div class="card-top"><p class="event-date">19–20 December 2026</p>
        <div class="event-details">
          <span class="age-category">16+ Y.O</span>
          <h2>World<br class="mobile-v2-break"> Breaking Championships</h2>
          <ul class="disciplines" aria-label="Disciplines"><li>B-Boys</li><li>B-Girls</li><li>Crew 5vs5</li></ul>
        </div>
        </div>
        <span class="learn-more" aria-hidden="true"><span>Learn more</span><span class="arrow"><img src="assets/arrow-right.svg" width="24" height="24" alt=""><img class="arrow-light" src="assets/arrow-right-light.svg" width="24" height="24" alt=""></span></span>
      </a>
      <a class="event-card" href="/junior-world-breaking-championships/" aria-label="Learn more about Junior World Breaking Championships">
        <div class="card-top"><p class="event-date">18 December 2026</p>
        <div class="event-details">
          <span class="age-category">10–15 Y.O</span>
          <h2>Junior<br class="mobile-v2-break"> World Breaking Championships</h2>
          <ul class="disciplines" aria-label="Disciplines"><li>B-Boys</li><li>B-Girls</li></ul>
        </div>
        </div>
        <span class="learn-more" aria-hidden="true"><span>Learn more</span><span class="arrow"><img src="assets/arrow-right.svg" width="24" height="24" alt=""><img class="arrow-light" src="assets/arrow-right-light.svg" width="24" height="24" alt=""></span></span>
      </a>
    </section>
    </div>
  </main>
</body>
</html>
